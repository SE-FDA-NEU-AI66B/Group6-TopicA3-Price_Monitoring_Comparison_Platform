services:
  - type: web
    name: pricelens
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run db:init && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
