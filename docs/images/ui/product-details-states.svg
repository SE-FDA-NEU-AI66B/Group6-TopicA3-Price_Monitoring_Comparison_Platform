<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Product Details empty, loading, error and data states</title>
  <desc id="desc">Four implemented Product Details states: loading the product, no price history, a retryable page error and a 30-point data chart.</desc>
  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#26323a}.title{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}.body{font-size:15px}.small{font-size:12px;fill:#59636a}.label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.card{fill:#fff;stroke:#66737a;stroke-width:1.5}.panel{fill:#f3f0e8;stroke:#a0a7ab;stroke-width:1.2}.button{fill:#27323a}.buttonText{fill:#fff;font-size:13px;font-weight:650}.accent{fill:#d5a43b}.error{fill:#f8eeee;stroke:#9b5c5c;stroke-width:1.3}
  </style>
  <rect width="1200" height="720" fill="#ece8df"/><text x="48" y="52" class="title">Product Details / Price History — implemented states</text>
  <g transform="translate(48 84)"><rect class="card" width="536" height="260" rx="14"/><text x="24" y="34" class="label">Loading state</text><rect class="panel" x="24" y="58" width="488" height="172" rx="10"/><text x="50" y="96" class="small">Product details</text><text x="50" y="132" class="h2">Loading tracked product…</text><text x="50" y="163" class="body">PriceLens is retrieving the exact variant</text><text x="50" y="187" class="body">and its price history.</text><circle cx="464" cy="145" r="28" fill="none" stroke="#d5a43b" stroke-width="7" stroke-dasharray="60 120"/></g>
  <g transform="translate(616 84)"><rect class="card" width="536" height="260" rx="14"/><text x="24" y="34" class="label">Empty state</text><text x="24" y="78" class="h2">30-day price history</text><text x="24" y="106" class="small">2026-09-20 to 2026-10-19 · 30 UTC calendar days</text><rect class="panel" x="24" y="126" width="488" height="84" rx="10"/><text x="268" y="174" text-anchor="middle" class="body">No price history available</text><text x="24" y="235" class="small">No empty chart or summary is rendered.</text></g>
  <g transform="translate(48 378)"><rect class="card" width="536" height="286" rx="14"/><text x="24" y="34" class="label">Error state</text><rect class="error" x="24" y="58" width="488" height="198" rx="10"/><text x="50" y="92" class="small">Product details unavailable</text><text x="50" y="128" class="h2">We could not load this tracked product</text><text x="50" y="158" class="body">Clear safe detail appears here.</text><rect class="button" x="50" y="184" width="118" height="42" rx="7"/><text x="109" y="211" text-anchor="middle" class="buttonText">Try again</text><text x="196" y="211" class="body">Return to watchlist</text></g>
  <g transform="translate(616 378)"><rect class="card" width="536" height="286" rx="14"/><text x="24" y="34" class="label">Data state</text><text x="24" y="72" class="h2">30-day price history</text><text x="24" y="96" class="small">30 persisted daily points · UTC range</text><line x1="50" y1="202" x2="486" y2="202" stroke="#c2c6c8"/><polyline points="50,128 88,136 126,122 164,148 202,140 240,162 278,154 316,180 354,166 392,190 430,178 486,198" fill="none" stroke="#27323a" stroke-width="3"/><circle cx="486" cy="198" r="5" class="accent"/><text x="50" y="230" class="small">Low 20,890,000 VND</text><text x="202" y="230" class="small">High 23,990,000 VND</text><text x="380" y="230" class="small">Current 20,890,000 VND</text><text x="24" y="264" class="small">Accessible chart title identifies all 30 daily points.</text></g>
</svg>
