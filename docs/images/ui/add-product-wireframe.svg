<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PriceLens Add Product wireframe</title>
  <desc id="desc">The Add Product page with URL resolution, exact variant selection and add-to-watchlist result.</desc>
  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#26323a}.h1{font-size:36px;font-weight:700}.h2{font-size:23px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#58636b}.label{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.frame{fill:#faf8f2;stroke:#27323a;stroke-width:2}.panel{fill:#fff;stroke:#899298;stroke-width:1.4}.button{fill:#27323a}.buttonText{fill:#fff;font-size:15px;font-weight:650}.accent{fill:#d5a43b}.success{fill:#eef5ea;stroke:#65795a;stroke-width:1.4}
  </style>
  <rect width="1200" height="760" fill="#ece8df"/><rect class="frame" x="24" y="24" width="1152" height="712" rx="16"/>
  <rect x="24" y="24" width="1152" height="72" rx="16" fill="#fff" stroke="#27323a" stroke-width="2"/><rect x="52" y="45" width="32" height="32" rx="6" class="accent"/><text x="96" y="69" class="h2">PriceLens</text><text x="810" y="66" class="body">Watchlist</text><text x="912" y="66" class="body">Add product</text><text x="1030" y="66" class="small">Signed in</text><text x="1112" y="66" class="body">Sign out</text>
  <text x="78" y="136" class="body">← Back to watchlist</text><text x="78" y="188" class="h1">Add a product</text><text x="78" y="218" class="body">Paste a supported retailer URL and confirm the exact product variant.</text>
  <rect class="panel" x="78" y="250" width="1044" height="128" rx="12"/><text x="102" y="282" class="label">Product URL</text><rect class="panel" x="102" y="296" width="770" height="50" rx="7"/><text x="120" y="327" class="small">https://digital-hub.example/apple-iphone-15-128gb-black</text><rect class="button" x="890" y="296" width="200" height="50" rx="8"/><text x="990" y="327" text-anchor="middle" class="buttonText">Resolve product</text><text x="102" y="365" class="small">Status: Product resolved. Choose the exact variant to continue.</text>
  <rect class="panel" x="78" y="402" width="640" height="272" rx="12"/><text x="102" y="434" class="label">Resolved product</text><text x="102" y="468" class="h2">Apple iPhone 15</text><text x="102" y="494" class="small">Apple · Digital Hub</text><text x="102" y="528" class="label">Choose the exact variant</text><circle cx="116" cy="566" r="10" fill="#27323a"/><circle cx="116" cy="566" r="4" fill="#fff"/><text x="142" y="571" class="body">iPhone 15 128GB Black</text><text x="142" y="594" class="small">Black · 128GB</text><rect class="button" x="102" y="616" width="592" height="40" rx="8"/><text x="398" y="642" text-anchor="middle" class="buttonText">Add to watchlist</text>
  <rect class="success" x="748" y="402" width="374" height="272" rx="12"/><text x="774" y="438" class="label">Tracking started</text><text x="774" y="476" class="h2">Product added to your watchlist</text><text x="774" y="510" class="body">Apple iPhone 15 — iPhone 15</text><text x="774" y="536" class="body">128GB Black is now Tracking.</text><rect class="button" x="774" y="576" width="156" height="46" rx="8"/><text x="852" y="605" text-anchor="middle" class="buttonText">View details</text><rect class="panel" x="944" y="576" width="150" height="46" rx="8"/><text x="1019" y="605" text-anchor="middle" class="body">Back to watchlist</text>
</svg>
