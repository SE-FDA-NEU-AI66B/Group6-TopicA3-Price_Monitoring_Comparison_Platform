<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">PriceLens Product Details wireframe</title>
  <desc id="desc">Product Details combines product identity, current price, 30-day history, comparison entry and price-alert creation.</desc>
  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#26323a}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:700}.body{font-size:15px}.small{font-size:12px;fill:#58636b}.label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.frame{fill:#faf8f2;stroke:#27323a;stroke-width:2}.panel{fill:#fff;stroke:#899298;stroke-width:1.4}.button{fill:#27323a}.buttonText{fill:#fff;font-size:14px;font-weight:650}.badge{fill:#e7e3d9;stroke:#a5abad}.accent{fill:#d5a43b}.success{fill:#eef5ea;stroke:#65795a;stroke-width:1.3}
  </style>
  <rect width="1200" height="820" fill="#ece8df"/><rect class="frame" x="24" y="24" width="1152" height="772" rx="16"/>
  <rect x="24" y="24" width="1152" height="70" rx="16" fill="#fff" stroke="#27323a" stroke-width="2"/><rect x="52" y="44" width="32" height="32" rx="6" class="accent"/><text x="96" y="67" class="h2">PriceLens</text><text x="790" y="65" class="body">Watchlist</text><text x="884" y="65" class="body">Add product</text><text x="1008" y="65" class="small">Signed in</text><text x="1100" y="65" class="body">Sign out</text>
  <text x="60" y="128" class="body">← Back to watchlist</text><rect x="60" y="150" width="112" height="96" rx="10" fill="#e8e4da" stroke="#9aa1a5"/><text x="116" y="202" text-anchor="middle" class="small">product</text><text x="196" y="172" class="label">Apple</text><text x="196" y="210" class="h1">Apple MacBook Air M2</text><text x="196" y="238" class="body">MacBook Air M2 8GB/256GB Midnight</text><rect class="badge" x="680" y="180" width="76" height="26" rx="13"/><text x="718" y="198" text-anchor="middle" class="small">Tracking</text><rect class="badge" x="766" y="180" width="108" height="26" rx="13"/><text x="820" y="198" text-anchor="middle" class="small">Gadget World</text>
  <rect class="panel" x="60" y="274" width="706" height="142" rx="12"/><text x="84" y="308" class="h2">Current observed price</text><text x="84" y="356" class="h1">20,890,000 VND</text><text x="84" y="386" class="small">Updated Oct 19, 2026, 09:00 AM</text><rect class="panel" x="576" y="330" width="164" height="46" rx="8"/><text x="658" y="359" text-anchor="middle" class="body">View source retailer</text>
  <rect class="panel" x="60" y="438" width="706" height="288" rx="12"/><text x="84" y="472" class="h2">30-day price history</text><text x="84" y="496" class="small">2026-09-20 to 2026-10-19 · 30 UTC calendar days</text><line x1="102" y1="620" x2="724" y2="620" stroke="#c2c6c8"/><line x1="102" y1="540" x2="102" y2="620" stroke="#c2c6c8"/><polyline points="102,552 128,558 154,565 180,556 206,570 232,577 258,563 284,581 310,590 336,575 362,595 388,602 414,588 440,606 466,614 492,600 518,618 544,628 570,612 596,630 622,638 648,625 674,642 724,650" fill="none" stroke="#27323a" stroke-width="3"/><circle cx="724" cy="650" r="5" class="accent"/><text x="102" y="674" class="small">Sep 20</text><text x="684" y="674" class="small">Oct 19</text><line x1="84" y1="692" x2="742" y2="692" stroke="#d4d7d8"/><text x="84" y="714" class="small">Low: 20,890,000 VND</text><text x="300" y="714" class="small">High: 23,990,000 VND</text><text x="530" y="714" class="small">Current: 20,890,000 VND</text>
  <rect class="panel" x="792" y="274" width="344" height="272" rx="12"/><text x="816" y="308" class="h2">Price alerts</text><text x="816" y="336" class="small">Current price</text><text x="816" y="360" class="body">20,890,000 VND</text><text x="816" y="394" class="label">Target price</text><rect class="panel" x="816" y="408" width="296" height="46" rx="7"/><text x="832" y="437" class="small">14000000.00</text><rect class="button" x="816" y="468" width="296" height="46" rx="8"/><text x="964" y="497" text-anchor="middle" class="buttonText">Create price alert</text><rect class="success" x="816" y="526" width="296" height="72" rx="8"/><text x="834" y="552" class="label">Price alert created · Active</text><text x="834" y="579" class="small">Target: 14,000,000 VND</text>
  <rect class="panel" x="792" y="624" width="344" height="102" rx="12"/><text x="816" y="656" class="h2">Compare retailer offers</text><text x="816" y="680" class="small">Eligible offers for this exact variant.</text><rect class="button" x="934" y="690" width="178" height="30" rx="7"/><text x="1023" y="711" text-anchor="middle" class="buttonText">Compare offers</text>
</svg>
