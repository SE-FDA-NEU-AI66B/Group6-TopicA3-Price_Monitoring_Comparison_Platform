<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PriceLens Watchlist wireframe</title>
  <desc id="desc">The authenticated watchlist with navigation, item count, Add product action and tracked-product cards.</desc>
  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#26323a}.h1{font-size:38px;font-weight:700}.h2{font-size:23px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#58636b}.label{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.frame{fill:#faf8f2;stroke:#27323a;stroke-width:2}.panel{fill:#fff;stroke:#899298;stroke-width:1.4}.button{fill:#27323a}.buttonText{fill:#fff;font-size:15px;font-weight:650}.badge{fill:#e7e3d9;stroke:#a5abad}.accent{fill:#d5a43b}
  </style>
  <rect width="1200" height="760" fill="#ece8df"/><rect class="frame" x="24" y="24" width="1152" height="712" rx="16"/>
  <rect x="24" y="24" width="1152" height="72" rx="16" fill="#fff" stroke="#27323a" stroke-width="2"/>
  <rect x="52" y="45" width="32" height="32" rx="6" class="accent"/><text x="96" y="69" class="h2">PriceLens</text>
  <text x="712" y="66" class="body">Watchlist</text><text x="810" y="66" class="body">Add product</text>
  <text x="930" y="66" class="small">Signed in as Demo Shopper</text><text x="1115" y="66" class="body">Sign out</text>

  <text x="64" y="144" class="label">Your watchlist</text><text x="64" y="192" class="h1">Tracked products</text>
  <text x="64" y="224" class="body">10 items in your watchlist.</text>
  <rect class="button" x="988" y="158" width="146" height="46" rx="8"/><text x="1061" y="187" text-anchor="middle" class="buttonText">Add product</text>

  <g transform="translate(64 270)"><rect class="panel" width="328" height="330" rx="12"/><rect x="18" y="18" width="292" height="98" rx="8" fill="#ece9e1"/><circle cx="164" cy="67" r="27" fill="none" stroke="#a5abad"/><text x="164" y="72" text-anchor="middle" class="small">product</text><rect class="badge" x="18" y="130" width="70" height="25" rx="12"/><text x="53" y="147" text-anchor="middle" class="small">Tracking</text><rect class="badge" x="96" y="130" width="82" height="25" rx="12"/><text x="137" y="147" text-anchor="middle" class="small">TechMart</text><text x="18" y="184" class="label">Apple</text><text x="18" y="216" class="h2">Apple iPhone 15</text><text x="18" y="242" class="small">iPhone 15 128GB Black</text><text x="18" y="280" class="h2">19,900,000 VND</text><text x="18" y="304" class="small">Updated Oct 10, 2026</text><text x="286" y="304" text-anchor="end" class="body">View →</text></g>
  <g transform="translate(436 270)"><rect class="panel" width="328" height="330" rx="12"/><rect x="18" y="18" width="292" height="98" rx="8" fill="#ece9e1"/><circle cx="164" cy="67" r="27" fill="none" stroke="#a5abad"/><text x="164" y="72" text-anchor="middle" class="small">product</text><rect class="badge" x="18" y="130" width="72" height="25" rx="12"/><text x="54" y="147" text-anchor="middle" class="small">Stale data</text><rect class="badge" x="98" y="130" width="70" height="25" rx="12"/><text x="133" y="147" text-anchor="middle" class="small">Tracking</text><text x="18" y="184" class="label">Apple</text><text x="18" y="216" class="h2">MacBook Air M2</text><text x="18" y="242" class="small">8GB/256GB Midnight</text><text x="18" y="280" class="h2">20,890,000 VND</text><text x="18" y="304" class="small">Updated Oct 19, 2026</text><text x="286" y="304" text-anchor="end" class="body">View →</text></g>
  <g transform="translate(808 270)"><rect class="panel" width="328" height="330" rx="12"/><rect x="18" y="18" width="292" height="98" rx="8" fill="#ece9e1"/><circle cx="164" cy="67" r="27" fill="none" stroke="#a5abad"/><text x="164" y="72" text-anchor="middle" class="small">product</text><rect class="badge" x="18" y="130" width="86" height="25" rx="12"/><text x="61" y="147" text-anchor="middle" class="small">Unavailable</text><rect class="badge" x="112" y="130" width="70" height="25" rx="12"/><text x="147" y="147" text-anchor="middle" class="small">Tracking</text><text x="18" y="184" class="label">Sony</text><text x="18" y="216" class="h2">Sony WH-1000XM5</text><text x="18" y="242" class="small">WH-1000XM5 Black</text><text x="18" y="280" class="h2">Price unavailable</text><text x="18" y="304" class="small">No in-stock current price.</text><text x="286" y="304" text-anchor="end" class="body">View →</text></g>
  <rect class="panel" x="64" y="630" width="1072" height="56" rx="10"/><text x="84" y="664" class="small">Cards continue responsively; each View action opens Product Details using the tracked-product identifier.</text>
</svg>
