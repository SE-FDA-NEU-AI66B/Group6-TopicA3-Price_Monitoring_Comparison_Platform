<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PriceLens Compare wireframe</title>
  <desc id="desc">Comparison page with exact product variant, ordered eligible in-stock offers, difference from lowest and lowest-offer summary.</desc>
  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#26323a}.h1{font-size:34px;font-weight:700}.h2{font-size:22px;font-weight:700}.body{font-size:15px}.small{font-size:12px;fill:#58636b}.label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.frame{fill:#faf8f2;stroke:#27323a;stroke-width:2}.panel{fill:#fff;stroke:#899298;stroke-width:1.4}.button{fill:#27323a}.buttonText{fill:#fff;font-size:14px;font-weight:650}.badge{fill:#e7e3d9;stroke:#a5abad}.accent{fill:#d5a43b}.best{fill:#f5edda;stroke:#c09435;stroke-width:1.5}
  </style>
  <rect width="1200" height="760" fill="#ece8df"/><rect class="frame" x="24" y="24" width="1152" height="712" rx="16"/>
  <rect x="24" y="24" width="1152" height="70" rx="16" fill="#fff" stroke="#27323a" stroke-width="2"/><rect x="52" y="44" width="32" height="32" rx="6" class="accent"/><text x="96" y="67" class="h2">PriceLens</text><text x="790" y="65" class="body">Watchlist</text><text x="884" y="65" class="body">Add product</text><text x="1008" y="65" class="small">Signed in</text><text x="1100" y="65" class="body">Sign out</text>
  <text x="64" y="130" class="body">← Back to product</text><rect x="64" y="154" width="94" height="84" rx="9" fill="#e8e4da" stroke="#9aa1a5"/><text x="111" y="200" text-anchor="middle" class="small">product</text><text x="184" y="174" class="label">Apple</text><text x="184" y="208" class="h1">Apple iPhone 15</text><text x="184" y="236" class="body">iPhone 15 128GB Black · tracked product</text>
  <text x="64" y="294" class="h2">Retailer comparison</text><text x="64" y="320" class="small">Current eligible offers for this exact variant, in PriceLens comparison order.</text>
  <rect class="best" x="64" y="350" width="1072" height="120" rx="12"/><circle cx="110" cy="410" r="27" class="accent"/><text x="110" y="415" text-anchor="middle" class="body">T</text><text x="158" y="388" class="h2">TechMart</text><text x="158" y="414" class="small">Lowest price · In stock</text><text x="482" y="398" class="h2">19,900,000 VND</text><text x="482" y="426" class="small">Difference from lowest: 0 VND</text><text x="776" y="402" class="small">Observed Oct 10, 2026</text><rect class="button" x="978" y="386" width="126" height="46" rx="8"/><text x="1041" y="415" text-anchor="middle" class="buttonText">Visit</text>
  <rect class="panel" x="64" y="488" width="1072" height="120" rx="12"/><circle cx="110" cy="548" r="27" fill="#e7e3d9"/><text x="110" y="553" text-anchor="middle" class="body">D</text><text x="158" y="526" class="h2">Digital Hub</text><text x="158" y="552" class="small">Eligible offer · In stock</text><text x="482" y="536" class="h2">20,200,000 VND</text><text x="482" y="564" class="small">Difference from lowest: 300,000 VND</text><text x="776" y="540" class="small">Observed Oct 10, 2026</text><rect class="button" x="978" y="524" width="126" height="46" rx="8"/><text x="1041" y="553" text-anchor="middle" class="buttonText">Visit</text>
  <rect class="panel" x="64" y="630" width="1072" height="72" rx="12"/><text x="88" y="658" class="label">Lowest eligible in-stock offer</text><text x="88" y="687" class="h2">TechMart · 19,900,000 VND</text><text x="1110" y="672" text-anchor="end" class="small">Out-of-stock and mismatched variants are not eligible rows.</text>
</svg>
